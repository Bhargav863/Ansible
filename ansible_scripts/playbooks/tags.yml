---
- name: Example playbook for tags
  hosts: all
  tasks: 
   - name: install httpd and firewalld
     package:
      name:
       - httpd
       - firewalld
      state: present
     tags:
      - install

   - name: install welcome page
     copy:
       content: Hello world
       dest: /var/www/html/index.html

   - name: start firewalld services
     service:
        name: firewalld
        enabled: true
        state: started
     tags:
        - start
   - name: start httpd services
     service:
        name: httpd
        enabled: true
        state: started
     tags:
        - starthttpd
   - name: open firewalld
     firewalld:
         service: http
         permanent: true
         state: enabled
         immediate: yes

- name: test webserver access
  hosts: ansiblenode1
  become: no
  tasks: 
     - name: connect to the webserver
       uri: 
        url: http://ansiblenode1
        return_content: yes
        status_code: 200
       register: output

     - name: show output 
       debug:
         var: output
       tags:
         - output
      



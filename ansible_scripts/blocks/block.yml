---
- name: This example demonstrates the usage of block module
  hosts: all
  tasks:
    - name: Install httpd and start httpd
      block: 
        - name: Install httpd
          package:
             name: httpd
             state: present
        - name: Start httpd
          service:
             name: httpd
             state: started
    - name: This is outside block
      debug:
        msg: I am out of the block

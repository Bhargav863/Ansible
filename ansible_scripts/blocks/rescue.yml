---
- name: This example demonstrates the usage of rescue module incase of task failure in block
  hosts: all
  tasks:
    - name: Install nginx and start nginx
      block:
        - name: Install nginx
          package:
             name: nginx
             state: present
        - name: Start nginx
          service:
             name: nginx
             state: started
      rescue:
        - name: Run this task if the block fails
          debug:
            msg: >
              You can use the rescue section to include all the tasks that you want to run in case
              one or more tasks in the block has failed.

    - name: This is outside block
      debug:
        msg: I am out of the block


